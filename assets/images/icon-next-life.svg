<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18042B"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#EC4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#cyberBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Futuristic DNA / Infinity Life Loop -->
  <g filter="url(#glow)">
    <path d="M160 256 C160 200 210 200 256 256 C302 312 352 312 352 256 C352 200 302 200 256 256 C210 312 160 312 160 256 Z" 
          fill="none" stroke="url(#neonPulse)" stroke-width="26" stroke-linecap="round"/>
  </g>
  
  <!-- Regal Crown of Destiny -->
  <g filter="url(#glow)">
    <path d="M180 170 L218 205 L256 145 L294 205 L332 170 L322 230 L190 230 Z" fill="url(#goldCrown)"/>
    <circle cx="180" cy="165" r="9" fill="#FDE047"/>
    <circle cx="256" cy="140" r="11" fill="#FDE047"/>
    <circle cx="332" cy="165" r="9" fill="#FDE047"/>
  </g>

  <!-- Sparkle nodes -->
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
  <circle cx="208" cy="256" r="5" fill="#38BDF8"/>
  <circle cx="304" cy="256" r="5" fill="#F472B6"/>
  
  <!-- Subtle circuit tech lines -->
  <line x1="120" y1="360" x2="190" y2="360" stroke="#A855F7" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="190" cy="360" r="5" fill="#A855F7"/>
  <line x1="392" y1="360" x2="322" y2="360" stroke="#EC4899" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="322" cy="360" r="5" fill="#EC4899"/>
</svg>